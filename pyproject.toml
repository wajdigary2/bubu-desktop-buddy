[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bubu-desktop-buddy"
version = "2.0.0"
description = "A tiny open-source desktop companion: Bubu the bear walks along your taskbar, naps, dances and begs for snacks."
readme = "README.md"
license = "MIT"
authors = [{ name = "Bubu Desktop Buddy contributors" }]
requires-python = ">=3.10"
keywords = ["desktop-pet", "desktop-buddy", "companion", "qt", "windows", "linux"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
build = ["pyinstaller>=6.6"]

[project.gui-scripts]
bubu-desktop-buddy = "bubu.app:main"

[project.urls]
Homepage = "https://github.com/wajdigary2/bubu-desktop-buddy"
Repository = "https://github.com/wajdigary2/bubu-desktop-buddy"

[tool.setuptools.packages.find]
include = ["bubu*"]
